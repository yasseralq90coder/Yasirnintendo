plugins { id 'com.android.application' }
android {
 namespace 'com.yasir.nintendo'
 buildFeatures { buildConfig true }
 compileSdk 35
 defaultConfig {
  applicationId 'com.yasir.nintendo'
  minSdk 26
  targetSdk 35
  versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
  versionName = '3.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.14.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
}
