plugins { id 'com.android.application' }
android {
 namespace 'com.yasir.nintendo'
 buildFeatures { buildConfig true }
 compileSdk 35
 defaultConfig {
  applicationId 'com.yasir.nintendo'
  minSdk 26
  targetSdk 35
  versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
  versionName = '5.2.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  release {
   def signingPath = System.getenv('ANDROID_SIGNING_STORE_FILE')
   if (signingPath) {
    storeFile file(signingPath)
    storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
    keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { debuggable true }
  release { minifyEnabled false; debuggable false; signingConfig signingConfigs.release }
 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.14.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
}

// Local debug tests remain available, but a distributable release must never
// silently fall back to an ephemeral debug key.
gradle.taskGraph.whenReady { graph ->
 if (graph.allTasks.any { it.project == project && it.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] }) {
  ['ANDROID_SIGNING_STORE_FILE', 'ANDROID_SIGNING_STORE_PASSWORD', 'ANDROID_SIGNING_KEY_ALIAS', 'ANDROID_SIGNING_KEY_PASSWORD'].each { name ->
   if (!System.getenv(name)) throw new GradleException("Missing persistent signing configuration: " + name)
  }
 }
}
