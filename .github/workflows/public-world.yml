name: Refresh official Nintendo world
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: public-world-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official public Nintendo headlines and catalogue
        run: python3 tools/refresh-world.py
      - name: Save public snapshot and deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- nintendo-world.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add nintendo-world.json
            git commit -m 'Refresh official public Nintendo headlines and catalogue'
            git push
            gh workflow run pages.yml --ref main
          fi
