name: Test and deploy Nintendo Journey
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Package public application only
        run: |
          mkdir dist
          cp kingdom.js kingdom-state.js kingdom-ui.js kingdom.css companion.js companion-ui.js companion.css store-data.json index.html app.js adventure-ui.js nintendo-world-ui.js nintendo-world.js chronicle.js journey.js core.js native-android.js nintendo-sync.js sync-ui.js legacy-library.js styles.css journey.css world.css nintendo-world.json sw.js manifest.webmanifest catalog.json library-seed.json dist/
          cp -r assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
