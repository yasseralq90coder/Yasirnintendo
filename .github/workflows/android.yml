name: Build requested Android preview
on:
  push:
    branches: [main]
    paths:
      - 'android/PREVIEW_BUILD'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test web logic and package bundled assets
        run: |
          npm ci --ignore-scripts
          npm test
          python -m unittest discover -s tools -p test_android_update.py
          npm run check
          node tools/package-android.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and test debug without distribution signing
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app launch and native bridge on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            (cd android && gradle --no-daemon connectedDebugAndroidTest)
            adb pull /data/local/tmp/yasir-layout-qa layout-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Populated-mobile-layout-QA
          path: |
            layout-qa/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Package tested preview
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/YasirNintendo.apk
          (cd apk && sha256sum YasirNintendo.apk > YasirNintendo.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: YasirNintendo-5.3-preview
          path: apk/
      - name: Publish requested fresh-install preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-preview >/dev/null 2>&1; then
            gh release create android-preview --target "$GITHUB_SHA" --title "Yasir Nintendo 5.3 — Preview" --notes-file android/PREVIEW_NOTES.md --prerelease
          fi
          gh release edit android-preview --title "Yasir Nintendo 5.3 — Preview" --notes-file android/PREVIEW_NOTES.md
          gh release upload android-preview apk/YasirNintendo.apk apk/YasirNintendo.apk.sha256 --clobber
