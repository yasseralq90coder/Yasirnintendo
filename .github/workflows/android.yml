name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - 'catalog.json'
      - 'library-seed.json'
      - 'assets/**'
      - 'tools/package-android.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yasir-android-preview-signing-v1
      - name: Test web logic and package bundled assets
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
          node tools/package-android.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, test and lint Android
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app launch and native bridge on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd android && gradle --no-daemon connectedDebugAndroidTest
      - name: Prepare installable APK and checksum
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/YasirNintendo.apk
          cd apk
          sha256sum YasirNintendo.apk > YasirNintendo.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: YasirNintendo-Android-APK
          path: apk/
          retention-days: 30
      - name: Publish Android preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-preview >/dev/null 2>&1; then
            gh release create android-preview --target "$GITHUB_SHA" --title "Yasir Nintendo — Android Preview" --notes-file android/RELEASE_NOTES.md --prerelease
          fi
          gh release upload android-preview apk/YasirNintendo.apk apk/YasirNintendo.apk.sha256 --clobber
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
